<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nouvel auteur - BIBLIO</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/header.css">
    <link rel="stylesheet" href="../../css/sidebar.css">
    <link rel="stylesheet" href="../../css/footer.css">
    <link rel="stylesheet" href="../../css/forms.css">
</head>
<body>
    <div id="header-container"></div>

    <div class="app-layout">
        <div id="sidebar-container"></div>

        <main class="main-content">
            <div class="page-header">
                <div>
                    <a href="/pages/auteurs/auteur.html" class="back-link">
                        <i class="fas fa-arrow-left"></i> Retour à la liste
                    </a>
                    <h1 class="page-title" id="formTitle">Nouveau auteur</h1>
                    <p class="page-subtitle" id="formSubtitle">Ajouter un auteur</p>
                </div>
            </div>

            <div class="card form-card">
                <form id="auteurForm">
                    <div class="form-group">
                        <label for="nom">Nom <span class="required">*</span></label>
                        <input type="text" id="nom" name="nom" required placeholder="Ex: Albert Camus">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="nationalite">Nationalité <span class="required">*</span></label>
                            <input type="text" name="nationalite" id="nationalite" placeholder="Ex: Française">
                        </div>
                    </div>

                    <div class="form-actions">
                        <a href="/pages/auteurs/auteur.html" class="btn btn-secondary">
                            Annuler
                        </a>
                        <button type="submit" class="btn btn-primary" id="submitBtn">
                            <i class="fas fa-save"></i> Enregistrer
                        </button>
                    </div>

                    <div id="formError" class="form-error" style="display: none;"></div>
                </form>
            </div>
        </main>
    </div>

    <div id="footer-container"></div>

    <script src="../../js/layout.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/auteurs/create.js"></script>
</body>
</html>
