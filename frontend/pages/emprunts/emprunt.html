<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Livres - BIBLIO</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/header.css">
    <link rel="stylesheet" href="../../css/sidebar.css">
    <link rel="stylesheet" href="../../css/footer.css">
</head>
<body>
    <div id="header-container"></div>

    <div class="app-layout">

        <div id="sidebar-container"></div>

        <main class="main-content">
            <div class="page-header">
                <div>
                    <h1 class="page-title">Emprunts</h1>
                    <p class="page-subtitle">Gérez vos emprunts</p>
                </div>
                <a href="/pages/emprunts/create.html" class="btn btn-primary"><i class="fas fa-plus"></i> Ajouter un emprunt</a>
            </div>

            <div class="search-bar">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Rechercher un emprunt...">
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Date Emprunt</th>
                            <th>Livre</th>
                            <th>Auteur</th>
                            <th>Adhérent</th>
                            <th>Statut</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="tableEmprunt">
                        <tr><td colspan="6" class="loading">Chargement...</td></tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Footer chargé par layout.js -->
    <div id="footer-container"></div>

    <script src="../../js/layout.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/emprunts/emprunt.js"></script>
</body>
</html>
