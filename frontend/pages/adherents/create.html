<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adhérent - BIBLIO</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/header.css">
    <link rel="stylesheet" href="/css/sidebar.css">
    <link rel="stylesheet" href="/css/footer.css">
    <link rel="stylesheet" href="/css/forms.css">
</head>
<body>
    <div id="header-container"></div>

    <div class="app-layout">
        <div id="sidebar-container"></div>

        <main class="main-content">
            <div class="page-header">
                <div>
                    <a href="/pages/adherents/adherent.html" class="back-link">
                        <i class="fas fa-arrow-left"></i> Retour à la liste
                    </a>
                    <h1 class="page-title" id="formTitle">Nouvel adhérent</h1>
                    <p class="page-subtitle" id="formSubtitle">Inscrire un nouveau membre</p>
                </div>
            </div>

            <div class="card form-card">
                <form id="entityForm">
                    <div class="form-group">
                        <label for="nom_adherent">Nom complet <span class="required">*</span></label>
                        <input type="text" id="nom_adherent" name="nom_adherent" required>
                    </div>

                    <div class="form-group">
                        <label for="contact">Contact (email ou téléphone) <span class="required">*</span></label>
                        <input type="text" id="contact" name="contact" required>
                    </div>

                    <div class="form-actions">
                        <a href="/pages/adherents/adherent.html" class="btn btn-secondary">Annuler</a>
                        <button type="submit" class="btn btn-primary" id="submitBtn">
                            <i class="fas fa-save"></i> Enregistrer
                        </button>
                    </div>

                    <div id="formError" class="form-error" style="display: none;"></div>
                </form>
            </div>
        </main>
    </div>

    <div id="footer-container"></div>

    <script src="../../js/layout.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/adherents/create.js"></script>
</body>
</html>
